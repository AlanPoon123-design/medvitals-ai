networks:
  # internal isolated network: no external access allowed for the backend
  medvitals-internal-net:
    driver: bridge
    internal: true
  # public-facing network for gateway traffic
  medvitals-public-net:
    driver: bridge

services:
  # Java 21 High-Throughput Engine for Analytics
  analytics-engine: 
    build:
      context: ./src/MedVitals.Analytics
      dockerfile: Dockerfile
    container_name: medvitals-analytics
    restart: always
    networks: 
      - medvitals-internal-net
    # Port 8080 is NOT exposed to host machine/public internet
    # accessible strictly inside 'medvitals-internal-net'
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      # Spring Boot Actuator readiness probe (curl is installed in the analytics image)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  # ASP.NET Core API Gateway
  gateway-portal:
    build:
      context: ./src/MedVitals.Gateway
      dockerfile: Dockerfile
    container_name: medvitals-gateway
    restart: always
    ports:
      # gateway listens on 8080 inside the container; put a TLS-terminating proxy in front for HTTPS
      - "5000:8080"
    networks:
      - medvitals-public-net
      - medvitals-internal-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AnalyticsEngine__BaseUrl=http://analytics-engine:8080
      # API keys (required in Production; the gateway refuses to start without them). Set in .env
      - Auth__DeviceApiKey=${MEDVITALS_DEVICE_API_KEY:?set MEDVITALS_DEVICE_API_KEY in .env}
      - Auth__DashboardApiKey=${MEDVITALS_DASHBOARD_API_KEY:?set MEDVITALS_DASHBOARD_API_KEY in .env}
      # origin the browser dashboard is served from
      - Cors__AllowedOrigins__0=${MEDVITALS_DASHBOARD_ORIGIN:-http://localhost:5500}
      # honour X-Forwarded-Proto/For from a TLS-terminating reverse proxy
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      # uncomment once HTTPS is served by the proxy to redirect HTTP -> HTTPS
      # (devices must then use USE_TLS=1 in the firmware)
      # - ASPNETCORE_HTTPS_PORT=443
    depends_on:
      analytics-engine:
        condition: service_healthy
