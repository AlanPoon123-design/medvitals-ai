# server port configuration
server.port=8080

# actuator: expose only health, with liveness/readiness probes (used by docker-compose healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Spring Jackson JSON configuration
spring.jackson.default-property-inclusion=non_null

# multipart file/payload limis (useful if uplading CSV batches)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# logging confiugration for debugging inference and MEWS evaluation traces
logging.level.com.medvitals.analytics=DEBUG