# server port configuration
server.port=8080

# Spring Jackson JSON configuration
spring.jackson.default-property-inclusion=non_null

# multipart file/payload limis (useful if uplading CSV batches)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# logging confiugration for debugging inference and MEWS evaluation traces
logging.level.com.medvitals.analytics=DEBUG